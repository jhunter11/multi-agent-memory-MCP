name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Node 22 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run release gate
        run: npm run verify
      - name: Test setup script on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup.ps1 -Client none -SkipInstall
      - name: Test setup script on macOS and Linux
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/setup.sh --client none --skip-install
